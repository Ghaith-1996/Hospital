name: phase-1-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run that is still going.
# Pushes to main and the long-lived branch are never cancelled, so every commit keeps its own result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Restore backend dependencies
        run: dotnet restore src/backend/CriticalAlerts.sln --locked-mode

      - name: Verify backend formatting
        run: dotnet format src/backend/CriticalAlerts.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Verify OpenAPI contract
        shell: pwsh
        run: ./scripts/verify-openapi.ps1

      - name: Scan backend dependencies
        run: dotnet list src/backend/CriticalAlerts.sln package --vulnerable --include-transitive --no-restore

      - name: Build backend
        run: dotnet build src/backend/CriticalAlerts.sln --configuration Release --no-restore --nologo

      - name: Run backend tests
        run: dotnet test src/backend/CriticalAlerts.sln --configuration Release --no-build --nologo

      - name: Evaluate fictional speech and structuring fixtures
        shell: pwsh
        run: ./scripts/run-ai-evaluation.ps1

      - name: Verify runtime observability safety
        shell: pwsh
        run: ./scripts/verify-observability-safety.ps1

      - name: Verify real PostgreSQL restore and failure cleanup
        shell: pwsh
        env:
          ASPNETCORE_ENVIRONMENT: Test
        run: |
          ./scripts/db-restore-test.ps1 -ConfirmRestoreTest
          ./scripts/test-db-restore-safety.ps1 -ExerciseCleanup

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix src/web --no-audit --no-fund

      - name: Scan web dependencies
        run: npm audit --prefix src/web --audit-level=high --omit=dev

      - name: Run web unit tests
        run: npm --prefix src/web test -- --run

      - name: Typecheck web
        run: npm --prefix src/web run typecheck

      - name: Lint web
        run: npm --prefix src/web run lint

      - name: Verify active workflow storage safety
        shell: pwsh
        run: ./scripts/verify-web-storage-safety.ps1

      - name: Build production web
        run: npm --prefix src/web run build

  system-e2e:
    name: system-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/web/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore src/backend/CriticalAlerts.sln --locked-mode

      - name: Install root test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci --prefix src/web --no-audit --no-fund

      - name: Install Playwright browser
        timeout-minutes: 12
        run: |
          npx playwright install-deps chromium
          for attempt in 1 2 3; do
            if timeout 180s npx playwright install --only-shell chromium; then
              exit 0
            fi
            echo "Headless Chromium installation attempt $attempt failed; retrying within the bounded CI step."
          done
          exit 1

      - name: Run web smoke test
        run: npm run web:e2e

      - name: Run connected system E2E
        shell: pwsh
        run: ./scripts/system-e2e.ps1

      - name: Run connected assistance E2E with explicit simulation flags
        shell: pwsh
        run: ./scripts/system-e2e.ps1 -EnableAssistance -TestPattern 'Phase11:'

  containers:
    name: containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API container
        run: docker build --file src/backend/CriticalAlerts.Api/Dockerfile --tag critical-alerts-api:ci .

      - name: Build worker container
        run: docker build --file src/backend/CriticalAlerts.Worker/Dockerfile --tag critical-alerts-worker:ci .

      - name: Build web container
        run: docker build --file src/web/Dockerfile --tag critical-alerts-web:ci .

      - name: Verify web container API proxy
        shell: pwsh
        run: ./scripts/verify-web-container.ps1 -WebImage critical-alerts-web:ci

  repository-safety:
    name: repository-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repository safety check
        shell: pwsh
        run: ./scripts/verify-no-sensitive-data.ps1

  # Keeps the single "verify" check name that the pull request has always reported,
  # now as the gate over the parallel jobs above.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, web, system-e2e, containers, repository-safety]
    if: ${{ always() }}
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required CI job did not succeed."
              exit 1
            fi
          done
