name: phase-1-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore src/backend/CriticalAlerts.sln --locked-mode

      - name: Verify backend formatting
        run: dotnet format src/backend/CriticalAlerts.sln --verify-no-changes --no-restore --verbosity minimal

      - name: Verify OpenAPI contract
        shell: pwsh
        run: ./scripts/verify-openapi.ps1

      - name: Scan backend dependencies
        run: dotnet list src/backend/CriticalAlerts.sln package --vulnerable --include-transitive --no-restore

      - name: Build backend
        run: dotnet build src/backend/CriticalAlerts.sln --configuration Release --no-restore --nologo

      - name: Run backend tests
        run: dotnet test src/backend/CriticalAlerts.sln --configuration Release --no-build --nologo

      - name: Install root test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install web dependencies
        run: npm ci --prefix src/web --no-audit --no-fund

      - name: Scan web dependencies
        run: npm audit --prefix src/web --audit-level=high --omit=dev

      - name: Run web unit tests
        run: npm --prefix src/web test -- --run

      - name: Typecheck web
        run: npm --prefix src/web run typecheck

      - name: Lint web
        run: npm --prefix src/web run lint

      - name: Verify active workflow storage safety
        shell: pwsh
        run: ./scripts/verify-web-storage-safety.ps1

      - name: Build production web
        run: npm --prefix src/web run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run web smoke test
        run: npm run web:e2e

      - name: Run connected system E2E
        shell: pwsh
        run: ./scripts/system-e2e.ps1

      - name: Build API container
        run: docker build --file src/backend/CriticalAlerts.Api/Dockerfile --tag critical-alerts-api:ci .

      - name: Build worker container
        run: docker build --file src/backend/CriticalAlerts.Worker/Dockerfile --tag critical-alerts-worker:ci .

      - name: Build web container
        run: docker build --file src/web/Dockerfile --tag critical-alerts-web:ci .

      - name: Verify web container API proxy
        shell: pwsh
        run: ./scripts/verify-web-container.ps1 -WebImage critical-alerts-web:ci

      - name: Run repository safety check
        shell: pwsh
        run: ./scripts/verify-no-sensitive-data.ps1
